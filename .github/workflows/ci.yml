name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    # Байт-ижил conformance: Go reference-ийн golden (testdata/golden) Windows ба Linux дээр.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          # 8.0.x — GeregeSystems.EidMongolia.Tests-ийн net8.0 target-ийн runtime (build нь 10.0 SDK-гаар).
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet restore EidMongolia.Pades.sln
      - run: dotnet format EidMongolia.Pades.sln --verify-no-changes --no-restore
      - run: dotnet build EidMongolia.Pades.sln -c Release
      - run: dotnet test EidMongolia.Pades.sln -c Release --no-build --logger "console;verbosity=normal"
      - name: pack
        # Lockstep гурван багц (core, AspNetCore, Pades) + snupkg; хувилбар нь Pades csproj-ийн <Version>.
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          dotnet pack EidMongolia.Pades.sln -c Release --no-build -o artifacts/nupkg
          ver=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/GeregeSystems.EidMongolia.Pades/GeregeSystems.EidMongolia.Pades.csproj)
          ./build/check-packages.sh artifacts/nupkg "$ver"
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: nupkg
          path: |
            artifacts/nupkg/*.nupkg
            artifacts/nupkg/*.snupkg
          if-no-files-found: error

  compat:
    # Pades 0.16.0-ийн (nuget.org) эсрэг compile хийсэн «Миний QR» хэрэглэгч 0.17.0-ийн dll дээр (TypeForwardedTo → core)
    # дахин compile-гүйгээр ажиллана; мөн энэ репогийн Pades-ийн эсрэг source-оор compile болно (docs/release-0.17.0.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: build 0.17.0 (net8.0)
        run: dotnet build src/GeregeSystems.EidMongolia.Pades -c Release -f net8.0
      - name: source compat (энэ репогийн Pades)
        run: |
          dotnet build build/compat/PadesQrCompat -c Release
          dotnet build/compat/PadesQrCompat/bin/Release/net8.0/PadesQrCompat.dll GeregeSystems.EidMongolia
      - name: binary compat (Pades 0.16.0-ийн эсрэг compile → 0.17.0-ийн dll)
        shell: bash
        run: |
          rm -rf build/compat/PadesQrCompat/bin build/compat/PadesQrCompat/obj
          dotnet build build/compat/PadesQrCompat -c Release -p:CompatAgainst=0.16.0 -o .compat/bin
          dotnet .compat/bin/PadesQrCompat.dll GeregeSystems.EidMongolia.Pades
          cp src/GeregeSystems.EidMongolia.Pades/bin/Release/net8.0/GeregeSystems.EidMongolia.Pades.dll .compat/bin/
          cp src/GeregeSystems.EidMongolia/bin/Release/net8.0/GeregeSystems.EidMongolia.dll .compat/bin/
          # deps.json-д core алга (0.16.0) — устгавал host app хавтасны бүх dll-ийг ачаална.
          rm .compat/bin/PadesQrCompat.deps.json
          dotnet .compat/bin/PadesQrCompat.dll GeregeSystems.EidMongolia

  golden-sync:
    # testdata/golden нь build/go-sdk.ref дээрх eid-mongolia-sdk-go pades/testdata/golden-тэй яг ижил.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./build/sync-golden.sh --check

  conformance-sync:
    # testdata/conformance нь build/go-sdk-conformance.ref дээрх eid-mongolia-sdk-go testdata/conformance-тэй
    # (rp-conformance/2, pki/keys-гүй) байт-ижил; бүх тохиолдлыг ConformanceTests (test job) ажиллуулна.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./build/sync-conformance.sh --check

  validate-sync:
    # testdata/pades-validate нь build/go-sdk-validate.ref дээрх eid-mongolia-sdk-go pades/testdata/validate (+ manifest-ийн
    # заасан golden файлууд, pki/*.key.pem-гүй)-тэй байт-ижил; бүх тохиолдлыг ValidatePdfCorpusTests (test job) ажиллуулна.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./build/sync-validate.sh --check

  changelog:
    # PR бүрд changelog.d/ фрагмент; CHANGELOG.md-г зөвхөн release/* салбар засна (анхны үүсгэлтээс бусад).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - shell: bash
        run: |
          base="origin/${{ github.base_ref }}"
          changed=$(git diff --name-only "$base"...HEAD)
          echo "$changed"
          if ! echo "$changed" | grep -qE '^changelog\.d/[0-9]{4}-[0-9]{2}-[0-9]{2}-.+\.md$'; then
            echo "::error::changelog.d/<YYYY-MM-DD>-<сэдэв>.md фрагмент нэмнэ үү"; exit 1
          fi
          if git diff --name-only --diff-filter=M "$base"...HEAD | grep -qx 'CHANGELOG.md' && [[ "${{ github.head_ref }}" != release/* ]]; then
            echo "::error::CHANGELOG.md-г зөвхөн release/* салбар засна"; exit 1
          fi
